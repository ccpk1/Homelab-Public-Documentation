# ============================================================
# CARD 4 — INTERNET CONTROLS (CONTROL D)
# ============================================================
# Auto-discovers the Control D access rules for the user's phone
# profile and renders them as a list of on/off toggles.
#
# NOTE ON "DEVICES": The original card supports two profiles — a
# phone profile AND a second "devices" profile (other devices in the
# same Control D profile, e.g. those coupled via Firewalla). For the
# single-user template we set g2 to none so it renders the phone
# profile only. If you have a second profile, set g2 to its name and
# label and both columns will render.
#
# This card relies on the Control D Manager integration exposing a
# `profile_name`, `item_type`, and `item_name` attribute on each
# entity. It uses the custom cards `auto-entities` and
# `multiple-entity-row`, and the `simple-icons` icon pack.
type: custom:auto-entities
card:
  type: entities
  title: Internet Controls (Control D)
  show_header_toggle: false
  state_color: true
filter:
  template: |
    {# --- 1. CONFIGURATION --- #} 
    {% set target_integration = "controld_manager" %}
    {% set target_fold_threshold = 9 %}
    {# Define Profiles. For a single-profile card, set g2 to none or use the same name as g1. #}
    {% set g1 = {'name': 'Kadens Phone', 'label': 'Phone 📱'} %} 
    {% set g2 = none %} 
    {# Smart detection for single vs dual profile rendering #}
    {% set is_single = true if g2 is none else (g1.name == g2.name) %}
    {# Global Filters to Opt-In #}
    {% set filter_whitelist = ['games', 'social'] %}
    {% set mapping = {
      'internet': {'name': 'Internet', 'icon': 'fa7-solid:earth', 'order': 1},
      'games': {'name': 'Gaming', 'icon': 'fa7-solid:gamepad', 'order': 2},
      'social': {'name': 'Social Media', 'icon': 'fa7-solid:users-rays', 'order': 3},
      'av': {'name': 'Video', 'icon': 'fa7-solid:clapperboard', 'order': 4},
      'youtube': {'name': 'YouTube', 'icon': 'simple-icons:youtube', 'order': 5},
      'tiktok': {'name': 'TikTok', 'icon': 'simple-icons:tiktok', 'order': 10},
      'discord': {'name': 'Discord', 'icon': 'simple-icons:discord', 'order': 10},
      'instagram': {'name': 'Instagram', 'icon': 'simple-icons:instagram', 'order': 6},
      'facebook': {'name': 'Facebook', 'icon': 'simple-icons:facebook', 'order': 10},
      'snapchat': {'name': 'Snapchat', 'icon': 'simple-icons:snapchat', 'order': 10},
      'twitter': {'name': 'X / Twitter', 'icon': 'simple-icons:x', 'order': 10},
      'reddit': {'name': 'Reddit', 'icon': 'simple-icons:reddit', 'order': 10},
      'telegram': {'name': 'Telegram', 'icon': 'simple-icons:telegram', 'order': 10},
      'twitch': {'name': 'Twitch', 'icon': 'simple-icons:twitch', 'order': 10}
    } %}
    {# --- 2. DISCOVERY & PRE-FILTERING --- #}  {% set ns = namespace(main_rows=[], fold_rows=[], g1_list=[], g2_list=[]) %}  {% set all_cd = integration_entities(target_integration) %}
    {# PASS 1: Split entities purely by the new 'profile_name' attribute #} {% for e in all_cd %}
      {% set p_name = state_attr(e, 'profile_name') | default('') %}
      {% if p_name == g1.name %}
        {% set ns.g1_list = ns.g1_list + [e] %}
      {% elif not is_single and p_name == g2.name %}
        {% set ns.g2_list = ns.g2_list + [e] %}
      {% endif %}
    {% endfor %}
    {# PASS 2: Match and Build Rows using item attributes #} {% for e1 in ns.g1_list %}
      {% set item_type = state_attr(e1, 'item_type') | default('') %}
      {% set item_name = state_attr(e1, 'item_name') | default('') %}
      
      {# Only process known Control D access rules #}
      {% if item_type in ['default_rule', 'service', 'filter'] %}
        
        {# Normalize item_name to cleanly map against the dictionary #}
        {% set clean = item_name | lower 
           | replace('default rule', 'internet') 
           | replace('x / twitter', 'twitter') 
           | replace(' ', '_') %}
        
        {# Filter: Internet, Services, or Whitelisted global filters #}
        {% if item_type != 'filter' or clean in filter_whitelist %}
          
          {# Find matching entity in g2 using identical type and name #}
          {% set e2_match = namespace(ent=none) %}
          {% if not is_single %}
            {% for e2 in ns.g2_list if e2_match.ent is none %}
              {% if state_attr(e2, 'item_type') == item_type and state_attr(e2, 'item_name') == item_name %}
                {% set e2_match.ent = e2 %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {# Lookup mapping, falling back to the raw attribute name if not found #}
          {% set info = mapping.get(clean, {'name': item_name, 'icon': 'fa7-solid:layer-group', 'order': 100}) %}
          
          {# UI Logic: Determine if entity is a filter to append label #}
          {% set is_filter = (item_type == 'filter') %}
          {% set row_title = info.name ~ ' (Filter)' if is_filter else info.name %}
          {% set sort_key = (info.order + 100) | string + info.name %}

          {# Dynamic Entity Construction (The Fix) #}
          {% if is_single %}
            {# Keep the compact custom row, but suppress the inner label with 'name: false' #}
            {% set row_ents = [{"entity": e1, "name": false, "toggle": is_filter}] %}
          {% else %}
            {% set row_ents = [{"entity": e1, "name": g1.label, "toggle": is_filter}] %}
            {% if e2_match.ent %}
              {% set row_ents = row_ents + [{"entity": e2_match.ent, "name": g2.label, "toggle": is_filter}] %}
            {% endif %}
          {% endif %}

          {% set row_config = {
            "type": "custom:multiple-entity-row",
            "entity": e1,
            "name": row_title,
            "icon": info.icon,
            "sort_key": sort_key,
            "show_state": false,
            "entities": row_ents
          } %}

          {# Partition #}
          {% if info.order <= target_fold_threshold %}
            {% set ns.main_rows = ns.main_rows + [row_config] %}
          {% else %}
            {% set ns.fold_rows = ns.fold_rows + [row_config] %}
          {% endif %}

        {% endif %}
      {% endif %}
    {% endfor %}
    {# Assemble the final output #} {% set output = ns.main_rows | sort(attribute='sort_key') %}
    {% if ns.fold_rows | length > 0 %}
      {% set fold_row = {
        "type": "custom:fold-entity-row",
        "head": {
          "type": "section",
          "label": "Additional Controls"
        },
        "padding": 0,
        "open": false,
        "entities": ns.fold_rows | sort(attribute='sort_key')
      } %}
      {% set output = output + [fold_row] %}
    {% endif %}
    {{ output }}
