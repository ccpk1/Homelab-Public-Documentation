# ============================================================
# PERSONAL DEVICES — DASHBOARD CARDS (SINGLE USER)
# ============================================================
# These are the cards from the "Personal Devices" dashboard's per-user
# view (e.g. the Kaden view), extracted and adjusted for a single user.
#
# They pair with the single-user YAML template
# (personal_devices_single_user.yaml) — the entities they reference
# are the ones that template creates.
#
# FIND/REPLACE: replace "kaden" with your user's name, matching the
# same convention used in the YAML template.
#
# NOTE: These cards use custom cards (button-card, stack-in-card,
# auto-entities, fold-entity-row) and card-mod. Install those via HACS
# before using them.
# ============================================================

# ============================================================
# CARD 1 — STATUS
# ============================================================
# Shows the user's current location and DNS filtering status.
# (The original card also showed Firewalla device connectivity and
# internet activity — those are router-level and covered in Part 2,
# so they're removed here.)
type: custom:button-card
entity: person.kaden
icon: mdi:security-network
name: Status
show_icon: true
styles:
  card:
    - padding: 16px
    - border-radius: 12px
    - border: 1px solid rgba(128, 128, 128, 0.2)
  custom_fields:
    location:
      - justify-self: stretch
      - margin-top: 16px
      - padding-bottom: 12px
      - border-bottom: 1px solid rgba(128, 128, 128, 0.2)
    phone_security:
      - justify-self: stretch
  grid:
    - grid-template-areas: '"i n" "location location" "phone_security phone_security"'
    - grid-template-columns: min-content 1fr
    - grid-template-rows: min-content min-content min-content
  icon:
    - color: var(--paper-item-icon-color)
    - width: 24px
    - height: 24px
    - transform: translateY(-1px)
  name:
    - justify-self: start
    - font-weight: normal
    - font-size: 24px
    - margin-left: 12px
tap_action:
  action: none
custom_fields:
  location: |
    [[[
      let person = states[variables.person_entity];
      let state = person ? person.state : 'Unknown';
      let icon = 'mdi:map-marker-radius';
      let color = 'var(--text-color)';
      if (state === 'home') { icon = 'mdi:home'; color = '#38a169'; state = 'Home'; }
      else if (state === 'not_home') { icon = 'mdi:home-export-outline'; color = '#e53e3e'; state = 'Away'; }
      else if (state !== 'Unknown') { icon = 'mdi:school'; color = '#805ad5'; }
      return `
        <div style="display:flex; justify-content: space-between; align-items: center; font-size: 13px;">
          <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; font-weight: normal;">Current Location</span>
          <span style="color: ${color}; font-weight: bold; display: flex; align-items: center;">
            <ha-icon icon="${icon}" style="width: 16px; height: 16px; margin-right: 6px; transform: translateY(-3px);"></ha-icon>
            ${state}
          </span>
        </div>
      `;
    ]]]
  phone_security: |
    [[[
      let dnsBypass = states[variables.sensor_dns_bypass];
      function buildRow(icon, label, entity) {
        if (!entity || entity.state === 'unavailable' || entity.state === 'unknown') return '';
        let isBypassed = entity.state === 'on';
        let statusIcon = isBypassed ? 'mdi:shield-alert' : 'mdi:shield-check';
        let statusColor = isBypassed ? '#e53e3e' : '#38a169';
        let statusText = isBypassed ? 'Bypassed' : 'Secured';
        return `
          <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px;">
            <span style="display: flex; align-items: center;">
              <ha-icon icon="${icon}" style="width: 16px; height: 16px; margin-right: 8px; opacity: 0.8; transform: translateY(-3px);"></ha-icon>
              <span>${label}</span>
            </span>
            <span style="color: ${statusColor}; font-weight: 500; display: flex; align-items: center;">
              <ha-icon icon="${statusIcon}" style="width: 14px; height: 14px; margin-right: 4px; transform: translateY(-3px);"></ha-icon>
              ${statusText}
            </span>
          </div>
        `;
      }
      let row = buildRow('mdi:dns', 'DNS Filtering Controls', dnsBypass);
      if (!row) return '';
      return `
        <div style="margin-top: 12px; margin-bottom: 8px;">
          <div style="font-size: 11px; text-align: left; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; margin-bottom: 12px;">Primary Phone Security</div>
          ${row}
        </div>
      `;
    ]]]
variables:
  person_entity: person.kaden
  sensor_dns_bypass: binary_sensor.kadens_phone_dns_bypassed

# ============================================================
# CARD 2 — DEVICE RULES
# ============================================================
# Shows the effective access mode plus the two layers that produce it
# (Access Profile + Access Enforcement). Fully supported by the
# single-user YAML template.
type: custom:button-card
entity: sensor.kaden_access_mode
icon: mdi:shield-account
name: Device Rules
show_icon: true
styles:
  card:
    - padding: 16px
    - border-radius: 16px
  grid:
    - grid-template-areas: '"i n" "effective effective" "layers layers"'
    - grid-template-columns: min-content 1fr
    - grid-template-rows: min-content min-content min-content
  icon:
    - color: var(--paper-item-icon-color)
    - width: 24px
    - height: 24px
  name:
    - justify-self: start
    - font-weight: normal
    - font-size: 24px
    - margin-left: 12px
tap_action:
  action: none
custom_fields:
  effective: |
    [[[
      let state = states[variables.effective_entity]?.state || 'Unknown';
      let colors = {
        'Standard': '#38a169', 'Focus': '#2b6cb0', 'Downtime': '#4c51bf',
        'Auto': '#38a169', 'Follow Profile': '#38a169', 'Pause Rules': '#319795',
        'Chore Lock': '#dd6b20', 'Lockdown': '#e53e3e', 'Unknown': 'var(--disabled-text-color)'
      };
      let color = colors[state] || 'var(--primary-color)';
      return `
        <div style="display:flex; justify-content: space-between; align-items: center; margin-top: 14px; margin-bottom: 12px;">
          <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6;">Current Mode</span>
          <span style="background: ${color}; color: white; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;">${state}</span>
        </div>
      `;
    ]]]
  layers: |
    [[[
      let baseState = states[variables.base_entity]?.state || 'Unknown';
      let holdState = states[variables.hold_entity]?.state || 'Unknown';
      return `
        <div style="padding-top: 12px; border-top: 1px solid rgba(128, 128, 128, 0.2);">
          <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px;">
            <span style="display:flex; align-items:center;">
              <ha-icon icon="mdi:tune-vertical" style="width: 16px; height: 16px; margin-right: 8px; opacity: 0.7;"></ha-icon>
              <span>Access Profile</span>
            </span>
            <span style="font-weight: 600;">${baseState}</span>
          </div>
          <div style="display:flex; justify-content: space-between; align-items: center; font-size: 13px;">
            <span style="display:flex; align-items:center;">
              <ha-icon icon="mdi:shield-sync" style="width: 16px; height: 16px; margin-right: 8px; opacity: 0.7;"></ha-icon>
              <span>Access Enforcement</span>
            </span>
            <span style="font-weight: 600;">${holdState}</span>
          </div>
        </div>
      `;
    ]]]
variables:
  base_entity: input_select.kaden_access_profile
  effective_entity: sensor.kaden_access_mode
  hold_entity: input_select.kaden_access_enforcement

# ============================================================
# CARD 3 — DEVICE MANAGEMENT
# ============================================================
# The interactive control stack: Access Profile pills, Access
# Enforcement buttons, and a "Configure" fold for alert settings.
# NOTE: In the original this card sits inside a grid with a
# `visibility` condition restricting it to specific users. If you
# want to restrict who can see/use it, add a matching `visibility`
# block to the grid that contains it.
type: custom:stack-in-card
mode: vertical
card_mod:
  style: |
    ha-card { padding: 16px !important; }
cards:
  # Header
  - type: custom:button-card
    entity: sensor.kaden_access_mode
    icon: mdi:shield-edit
    name: Device Management
    show_icon: true
    styles:
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: min-content 1fr
      icon:
        - color: var(--paper-item-icon-color)
        - width: 24px
        - height: 24px
      name:
        - justify-self: start
        - font-weight: normal
        - font-size: 24px
        - margin-left: 12px
    tap_action:
      action: none

  # Access Profile label
  - type: custom:button-card
    icon: mdi:tune-vertical
    name: Access Profile
    styles:
      card:
        - padding: 12px 0px 8px 0px
        - background: transparent
        - border: none
        - box-shadow: none
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: min-content 1fr
      icon:
        - width: 20px
        - color: var(--secondary-text-color)
        - margin-right: 8px
      name:
        - justify-self: start
        - font-size: 15px
        - font-weight: 400
        - color: var(--secondary-text-color)
    tap_action:
      action: none

  # Access Profile pills (Standard / Focus / Downtime)
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        entity: input_select.kaden_access_profile
        icon: mdi:shield-check-outline
        name: Standard
        show_icon: true
        show_label: true
        show_name: true
        show_state: false
        state:
          - value: Standard
            styles:
              icon:
                - color: "#38a169"
              name:
                - color: "#38a169"
        styles:
          icon:
            - width: 20px
            - color: var(--paper-item-icon-color)
          label:
            - font-size: 10px
            - text-transform: uppercase
            - letter-spacing: 0.6px
            - opacity: 0.6
          name:
            - font-size: 12px
            - font-weight: 700
        tap_action:
          action: call-service
          service: input_select.select_option
          data:
            entity_id: input_select.kaden_access_profile
            option: Standard
        card_mod:
          style: |
            ha-card {
              border-radius: 999px !important; box-shadow: none !important; padding: 8px !important;
              {% if is_state('input_select.kaden_access_profile', 'Standard') %}
                background: rgba(56, 161, 105, 0.16) !important;
                border: 1px solid rgba(56, 161, 105, 0.45) !important;
              {% else %}
                background: rgba(128, 128, 128, 0.05) !important;
                border: 1px solid rgba(128, 128, 128, 0.15) !important;
              {% endif %}
            }
      - type: custom:button-card
        entity: input_select.kaden_access_profile
        icon: mdi:target
        name: Focus
        show_icon: true
        show_label: true
        show_name: true
        show_state: false
        state:
          - value: Focus
            styles:
              icon:
                - color: "#2b6cb0"
              name:
                - color: "#2b6cb0"
        styles:
          icon:
            - width: 20px
            - color: var(--paper-item-icon-color)
          label:
            - font-size: 10px
            - text-transform: uppercase
            - letter-spacing: 0.6px
            - opacity: 0.6
          name:
            - font-size: 12px
            - font-weight: 700
        tap_action:
          action: call-service
          service: input_select.select_option
          data:
            entity_id: input_select.kaden_access_profile
            option: Focus
        card_mod:
          style: |
            ha-card {
              border-radius: 999px !important; box-shadow: none !important; padding: 8px !important;
              {% if is_state('input_select.kaden_access_profile', 'Focus') %}
                background: rgba(43, 108, 176, 0.16) !important;
                border: 1px solid rgba(43, 108, 176, 0.45) !important;
              {% else %}
                background: rgba(128, 128, 128, 0.05) !important;
                border: 1px solid rgba(128, 128, 128, 0.15) !important;
              {% endif %}
            }
      - type: custom:button-card
        entity: input_select.kaden_access_profile
        icon: mdi:sleep
        name: Downtime
        show_icon: true
        show_label: true
        show_name: true
        show_state: false
        state:
          - value: Downtime
            styles:
              icon:
                - color: "#4c51bf"
              name:
                - color: "#4c51bf"
        styles:
          icon:
            - width: 20px
            - color: var(--paper-item-icon-color)
          label:
            - font-size: 10px
            - text-transform: uppercase
            - letter-spacing: 0.6px
            - opacity: 0.6
          name:
            - font-size: 12px
            - font-weight: 700
        tap_action:
          action: call-service
          service: input_select.select_option
          data:
            entity_id: input_select.kaden_access_profile
            option: Downtime
        card_mod:
          style: |
            ha-card {
              border-radius: 999px !important; box-shadow: none !important; padding: 8px !important;
              {% if is_state('input_select.kaden_access_profile', 'Downtime') %}
                background: rgba(76, 81, 191, 0.16) !important;
                border: 1px solid rgba(76, 81, 191, 0.45) !important;
              {% else %}
                background: rgba(128, 128, 128, 0.05) !important;
                border: 1px solid rgba(128, 128, 128, 0.15) !important;
              {% endif %}
            }

  # Access Enforcement label
  - type: custom:button-card
    icon: mdi:shield-sync
    name: Access Enforcement
    styles:
      card:
        - padding: 16px 0px 8px 0px
        - background: transparent
        - border: none
        - box-shadow: none
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: min-content 1fr
      icon:
        - width: 20px
        - color: var(--secondary-text-color)
        - margin-right: 8px
      name:
        - justify-self: start
        - font-size: 15px
        - font-weight: 400
        - color: var(--secondary-text-color)
    tap_action:
      action: none

  # Access Enforcement buttons (Follow Profile / Pause Rules / Chore Lock / Lockdown)
